<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form | Task 2</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Form Header -->
        <div class="form-header">
            <h1>Get in Touch</h1>
            <p>Have a question or want to work together? Send us a message!</p>
        </div>

        <!-- Contact Form -->
        <div class="form-card">
            <form id="contactForm" novalidate>
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullName">
                        <i class="fa-regular fa-user"></i>
                        Full Name <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        placeholder="John Doe"
                        class="form-input"
                        required
                    >
                    <div class="error-message" id="fullNameError"></div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">
                        <i class="fa-regular fa-envelope"></i>
                        Email Address <span class="required">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="john@example.com"
                        class="form-input"
                        required
                    >
                    <div class="error-message" id="emailError"></div>
                </div>

                <!-- Subject Field -->
                <div class="form-group">
                    <label for="subject">
                        <i class="fa-regular fa-pen-to-square"></i>
                        Subject
                    </label>
                    <input 
                        type="text" 
                        id="subject" 
                        name="subject" 
                        placeholder="What's this about?"
                        class="form-input"
                    >
                </div>

                <!-- Message Field -->
                <div class="form-group">
                    <label for="message">
                        <i class="fa-regular fa-message"></i>
                        Message <span class="required">*</span>
                    </label>
                    <textarea 
                        id="message" 
                        name="message" 
                        placeholder="Write your message here..."
                        class="form-input"
                        rows="5"
                        required
                    ></textarea>
                    <div class="error-message" id="messageError"></div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Send Message</span>
                    <i class="fa-regular fa-paper-plane"></i>
                </button>
            </form>

            <!-- Success Message (hidden by default) -->
            <div class="success-message" id="successMessage">
                <i class="fa-regular fa-circle-check"></i>
                <h3>Message Sent!</h3>
                <p>Thank you for reaching out. We'll get back to you soon.</p>
                <button class="reset-btn" id="resetBtn">Send Another Message</button>
            </div>
        </div>

        <!-- Contact Information (Optional - adds professionalism) -->
        <div class="contact-info">
            <div class="info-item">
                <i class="fa-regular fa-envelope"></i>
                <div>
                    <h4>Email</h4>
                    <p>hello@taskflow.com</p>
                </div>
            </div>
            <div class="info-item">
                <i class="fa-regular fa-clock"></i>
                <div>
                    <h4>Response Time</h4>
                    <p>Within 24 hours</p>
                </div>
            </div>
            <div class="info-item">
                <i class="fa-regular fa-comment"></i>
                <div>
                    <h4>Live Chat</h4>
                    <p>Mon-Fri, 9am-5pm</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
